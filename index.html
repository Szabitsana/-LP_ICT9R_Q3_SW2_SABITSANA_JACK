<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUY YOUR DEVICES!</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-sm navbar-light bg-secondary">
  <div class="container-fluid">

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mynavbar">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="shop.html"><b>Shop</b></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="locate.html"><b>Locate</b></a>
        </li>
      </ul>

      <form class="d-flex">
        <input class="form-control me-2" type="text" placeholder="Search">
        <button class="btn btn-primary" type="button">SEARCH</button>
      </form>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <form>
    <div class="row">

      <div class="col fw-bold">
        <label for="device">Device Type</label>
        <input type="text" class="form-control" id="device" placeholder="laptop, ipad, etc">

        <button class="btn btn-primary mt-2 w-100" type="button" onclick="plus()">
          Brands & Discounts
        </button>
      </div>

      <div class="col fw-bold">
        <label for="budget">Budget</label>
        <input type="number" class="form-control" id="budget" placeholder="e.g. 1500">

        <button class="btn btn-primary mt-2 w-100" type="button">
          Store Location
        </button>
      </div>

    </div>

    <p id="result" class="mt-4 fw-bold text-success text-center"></p>
  </form>
</div>

<script>
  function plus() {
    let budgetValue = document.getElementById("budget").value;

    if (budgetValue === "") {
      document.getElementById("result").innerHTML = "Please enter a budget.";
      return;
    }

    let discount = Number(budgetValue) * 0.20;
    let finalPrice = Number(budgetValue) - discount;

    document.getElementById("result").innerHTML =
      "Discount (20%): " + discount + "<br>" +
      "Final Price: " + finalPrice;
  }
</script>

</body>
</html>

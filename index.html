<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Activity</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background: pink;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        form{
            background: lightgray;
            padding: 25px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .form-control{
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid white



        }

        button{
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: lightblue;
            color: white;
            font-size: 16px;
            cursor: pointer;


        }

        #result{
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            color: palevioletred;
        }


    </style>
</head>
<body>

    <form>
        <label> Enter 1st Number</label>
        <input type="number" id="ruby1" class="form-control">
        <label> Enter 2nd Number</label>
        <input type="number" id="ruby2" class="form-control">

        <button type="button" class="btn btn-success" onclick="plus()" > Click Me! </button>

        <div id="result"> Answer Here </div>
    </form>

    <script>

        function plus() {
            let ruby1 = document.getElementById("ruby1").value;
            let ruby2 = document.getElementById("ruby2").value;
            let sum = Number(ruby1) - Number(ruby2);

            document.getElementById("result").innerHTML = "The Answer Is:" + sum;
        }
        

    </script>

  

    
</body>
</html>
